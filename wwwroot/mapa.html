<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuraChih · Mapa</title>
  <meta name="description" content="Cafés, museos y parques de Chihuahua en el mapa.">
  <link rel="icon" href="assets/iconos/logo-sol.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/mapa.js"></script>
</head>
<body class="pagina-mapa">
  <!--
    Frames "Mapa (visitante)" y "Mapa" (logueado) de Figma: son la misma pantalla, solo cambia
    el estado del navbar. El panel lo pinta js/mapa.js; el mapa es el componente <sc-mapa>.
  -->
  <sc-navbar></sc-navbar>

  <main class="explorar-mapa">
    <aside class="panel-mapa" id="panel" aria-label="Lugares en el mapa"></aside>
    <sc-mapa id="mapa" aria-label="Mapa de lugares"></sc-mapa>
  </main>
</body>
</html>
