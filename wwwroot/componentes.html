<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuraChih · Componentes base</title>
  <link rel="icon" href="assets/iconos/logo-sol.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/estilos.css">
  <style>
    /* Solo para esta página de referencia */
    .catalogo { padding-block: 48px 96px; display: flex; flex-direction: column; gap: 56px; }
    .catalogo h1 { margin-bottom: 8px; }
    .muestra { display: flex; flex-direction: column; gap: 16px; }
    .muestra__fila { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
    .muestra__panel { padding: 24px; border-radius: var(--radio-l); background: var(--color-fondo); }
    .muestra__panel--blanco { background: var(--color-superficie); border: 1px solid var(--color-linea); }
    .muestra code { font: 13px/20px ui-monospace, Consolas, monospace; color: var(--color-texto-2); }
    .muestra__campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 360px)); gap: 20px; }
    .muestra__navbar sc-navbar { position: static; }
    .muestra__navbar { display: flex; flex-direction: column; gap: 16px; overflow: hidden; border-radius: var(--radio-l); border: 1px solid var(--color-linea); }
  </style>
  <script type="module" src="js/catalogo.js"></script>
</head>
<body>
  <main class="contenedor catalogo">
    <header>
      <h1 class="t-h1">Componentes base</h1>
      <p class="t-lead texto-2">Página "Rediseño" de Figma. Cada bloque dice cómo crear el componente en JavaScript.</p>
    </header>
    <div id="catalogo" class="catalogo"></div>
  </main>
</body>
</html>
